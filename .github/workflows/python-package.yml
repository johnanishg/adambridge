# Lint and test on every push and pull request to main. GitHub's runners have
# no GPU, so the CUDA tests are skipped; the native C kernels are compiled with
# the runner's gcc and checked by the C self-test.

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # CPU-only torch: the runners have no GPU, and the CUDA build is ~2 GB.
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        python -m pip install flake8 -e ".[test]"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Native C self-test
      run: |
        gcc -O2 -Wall -Wextra -pthread -o selftest tests/native/selftest.c -lm
        ./selftest
    - name: Test with pytest
      run: |
        pytest -q
